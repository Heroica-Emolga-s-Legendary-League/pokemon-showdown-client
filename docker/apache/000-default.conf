<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html/play.pokemonshowdown.com

	<Directory /var/www/html/play.pokemonshowdown.com>
		AllowOverride All
		Require all granted
		DirectoryIndex testclient.html
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
